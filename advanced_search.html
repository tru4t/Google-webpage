<html>
    <head>
        <title>Google Advanced Search</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>

    <body>

        <nav class="nav_adv">
            <div class="logo">
                <a href="index.html">
                <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo" width="100px" height="40px">

            </div>
        </nav>


        <form action="https://www.google.com/search">
            <div class="adv_search">
                <h2>Better Search</h2>
                <h3>Search for pages that contain</h3>
                <table>
                    <tr>
                        <td>all these words:</td>
                        <td><input type="text"  name="as_q" autoComplete="off"></td>
                    </tr>
                    <tr>
                        <td>this exact word or phrase:</td>
                        <td><input type="text" name="as_epq" autoComplete="off"></td>
                    </tr>
                    <tr>
                        <td>any of these words:</td>
                        <td><input type="text" name="as_eq" autoComplete="off"></td>
                    </tr>
                    <tr>
                        <td>none of these words:</td>
                        <td><input type="text" name="as_nq" autoComplete="off"></td>
                    </tr>
                </table>
            </div>

            <div class="adv_button">
                <input type="submit" value="Search">
            </div>
        </form>
    </body>
</html>
