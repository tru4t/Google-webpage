<html>
    <head>
        <title>Google Image Search</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>

    <body>

        <nav class="navbar">
            <a href="Image_search.html">Image Search</a>
            <a href="advanced_search.html">Advanced Search</a>
            <a href="index.html">Google Search</a>
        </nav>

        <div class="logo">
            <img src="https://i.pinimg.com/originals/e7/17/a3/e717a33d7226f2ec37219c50836e8783.png" alt="Google Logo" width="272" height="92">
        </div>

        <form action="https://www.google.com/search">
            <div class="search-container">
                <img src="https://www.bing.com/th/id/OIP.UfFXoK9ihlF0CPfVb8fcVAAAAA?" alt="Search_icon" width="40" height="40">
                <input type="hidden" name="tbm" value="isch">
                <input type="text" name="q" placeholder="Search images" autoComplete="off">
            </div>

            <div class="buttons">
                <input type="submit" value="Google Search">
            </div>
        </form>
    </body>
</html>
